<title>Context Diagram — AI Proctoring Module</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #111111;
    --grey: #5f5f5f;
    --hairline: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0c0c0c; --ink: #f2f2f2; --grey: #a8a8a8; --hairline: #f2f2f2; }
  }
  :root[data-theme="light"] { --paper: #ffffff; --ink: #111111; --grey: #5f5f5f; --hairline: #111111; }
  :root[data-theme="dark"]  { --paper: #0c0c0c; --ink: #f2f2f2; --grey: #a8a8a8; --hairline: #f2f2f2; }

  html, body { background: var(--paper); }
  body {
    margin: 0;
    padding: 2.5rem 1.5rem 3rem;
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin-bottom: 1.75rem; max-width: 60ch; }
  header .eyebrow {
    font-family: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--grey);
    margin: 0 0 0.5rem;
  }
  header h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0;
  }
  .frame {
    width: 100%;
    max-width: 900px;
    overflow-x: auto;
  }
  svg { width: 100%; height: auto; display: block; }

  /* SVG element styling via CSS so both themes track the tokens */
  .stroke { stroke: var(--hairline); fill: none; }
  .fillpaper { fill: var(--paper); stroke: var(--hairline); }
  .label-name { fill: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 600; }
  .label-sub  { fill: var(--grey); font-family: "SFMono-Regular","Consolas",Menlo,monospace; }
  .flow {
    fill: var(--ink);
    font-family: "SFMono-Regular","Consolas","Liberation Mono",Menlo,monospace;
    font-size: 13px;
  }
  .flow-bg { fill: var(--paper); }
  .arrow { stroke: var(--hairline); stroke-width: 1.6; fill: none; }
  .arrowhead { fill: var(--hairline); }

  .legend {
    margin-top: 2rem;
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
    font-family: "SFMono-Regular","Consolas",Menlo,monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--grey);
  }
  .legend span { display: inline-flex; align-items: center; gap: 0.5rem; }
  .legend svg { width: 34px; height: 20px; }
</style>

<header>
  <p class="eyebrow">Data Flow Diagram · Level 0</p>
  <h1>AI Exam Proctoring Module — Context Diagram</h1>
</header>

<div class="frame">
  <svg viewBox="0 0 900 620" role="img"
       aria-label="Context level data flow diagram for the AI proctoring module showing Student, Teacher and Database external entities.">
    <defs>
      <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3.2"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L9,3.2 L0,6.4 Z" class="arrowhead"/>
      </marker>
    </defs>

    <!-- ===== Central process ===== -->
    <circle cx="450" cy="310" r="118" class="fillpaper" stroke-width="1.8"/>
    <text x="450" y="292" text-anchor="middle" class="label-sub" font-size="15" font-weight="700">0</text>
    <text x="450" y="320" text-anchor="middle" class="label-name" font-size="19">AI Proctoring</text>
    <text x="450" y="344" text-anchor="middle" class="label-name" font-size="19">Module</text>

    <!-- ===== External entities ===== -->
    <!-- Student (left) -->
    <rect x="40" y="258" width="150" height="104" class="fillpaper" stroke-width="1.6"/>
    <line x1="40" y1="272" x2="190" y2="272" class="stroke" stroke-width="1.6"/>
    <text x="115" y="318" text-anchor="middle" class="label-name" font-size="18">Student</text>

    <!-- Teacher (right) -->
    <rect x="710" y="258" width="150" height="104" class="fillpaper" stroke-width="1.6"/>
    <line x1="710" y1="272" x2="860" y2="272" class="stroke" stroke-width="1.6"/>
    <text x="785" y="318" text-anchor="middle" class="label-name" font-size="18">Teacher</text>

    <!-- Database (bottom) -->
    <rect x="365" y="520" width="170" height="78" class="fillpaper" stroke-width="1.6"/>
    <line x1="365" y1="534" x2="535" y2="534" class="stroke" stroke-width="1.6"/>
    <text x="450" y="574" text-anchor="middle" class="label-name" font-size="18">Database</text>

    <!-- ===== Flows: Student -> Module (video frames, audio chunks) ===== -->
    <!-- upper arc student to module -->
    <path class="arrow" d="M190,288 C 270,270 300,264 341,278" marker-end="url(#head)"/>
    <rect class="flow-bg" x="196" y="234" width="228" height="20"/>
    <text class="flow" x="200" y="249">video frames, audio chunks</text>

    <!-- Module -> Student (warnings) lower arc -->
    <path class="arrow" d="M341,342 C 300,356 270,360 192,342" marker-end="url(#head)"/>
    <rect class="flow-bg" x="238" y="372" width="86" height="20"/>
    <text class="flow" x="242" y="387">warnings</text>

    <!-- ===== Module -> Teacher (student evidences & stats) ===== -->
    <path class="arrow" d="M568,300 C 640,286 670,286 709,300" marker-end="url(#head)"/>
    <rect class="flow-bg" x="556" y="252" width="256" height="20"/>
    <text class="flow" x="560" y="267">student evidences &amp; stats</text>

    <!-- ===== Module -> Database (evidences for storage) ===== -->
    <path class="arrow" d="M450,428 L 450,518" marker-end="url(#head)"/>
    <rect class="flow-bg" x="462" y="463" width="150" height="20"/>
    <text class="flow" x="466" y="478">evidence storage</text>
  </svg>
</div>

<div class="legend">
  <span>
    <svg viewBox="0 0 34 20"><circle cx="17" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    Process
  </span>
  <span>
    <svg viewBox="0 0 34 20"><rect x="4" y="3" width="26" height="14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    External entity
  </span>
  <span>
    <svg viewBox="0 0 34 20"><line x1="3" y1="10" x2="27" y2="10" stroke="currentColor" stroke-width="1.4"/><path d="M25,6 L31,10 L25,14 Z" fill="currentColor"/></svg>
    Data flow
  </span>
</div>
